<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="nrx-neon" x1="140" y1="120" x2="372" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4FF5E" />
      <stop offset="100%" stop-color="#B8FF1A" />
    </linearGradient>
    <linearGradient id="nrx-trail" x1="195" y1="265" x2="362" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C7FF3D" stop-opacity="0.08" />
      <stop offset="45%" stop-color="#C7FF3D" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#C7FF3D" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Solid dark background for high contrast on both light and dark browser tabs & Google SERP -->
  <rect width="512" height="512" rx="112" fill="#050507" />

  <!-- Outer neon ring -->
  <circle cx="256" cy="256" r="228" stroke="#C7FF3D" stroke-width="8" fill="#050507" />

  <!-- Main N upper-diagonal + right vertical stem -->
  <path
    d="M150 132 L318 264 L318 164 L362 132 L362 346 L150 180 Z"
    fill="url(#nrx-neon)"
  />

  <!-- Left vertical stem -->
  <path
    d="M150 202 L195 238 L195 340 L150 374 Z"
    fill="#C7FF3D"
  />

  <!-- Lower parallel diagonal slash -->
  <path
    d="M195 256 L362 386 L362 412 L195 282 Z"
    fill="url(#nrx-trail)"
  />
</svg>